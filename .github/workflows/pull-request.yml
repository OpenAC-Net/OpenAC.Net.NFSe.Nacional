name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  validate:
    name: Build, Test and Pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Build solution
        run: dotnet build OpenAC.Net.NFSe.Nacional.slnx --configuration Release -p:GeneratePackageOnBuild=false

      - name: Run offline tests on .NET 10 and .NET 11
        shell: pwsh
        env:
          # Provider integration tests need certificates and a local .env file.
          OFFLINE_TEST_CLASSES: >-
            TestCompatibilidadeComportamental
            TestCompatibilidadeHttpWeb
            TestDANFSePDF
            TestDANFSeWebRegistration
            TestDFeInfrastructure
            TestDocumentStore
            TestEmissaoISSNet
            TestMultiTenantWeb
            TestRespostaHttpNacional
            TestSchemaV101
            TestSilTecnologia
            TestWebServiceRegistration
            TestXmlSerialization
        run: |
          $classPatterns = ($env:OFFLINE_TEST_CLASSES -split '\s+' | ForEach-Object { "($_)" }) -join '|'
          $filter = "/*/*/$classPatterns/*"
          foreach ($framework in 'net10.0', 'net11.0') {
            dotnet run --project OpenAC.Net.NFSe.Nacional.Test/OpenAC.Net.NFSe.Nacional.Test.csproj --configuration Release --framework $framework --no-build -- --treenode-filter $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pack NuGet packages
        run: dotnet pack OpenAC.Net.NFSe.Nacional.slnx --configuration Release --no-build --output ../nuget

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: nuget/*.nupkg
